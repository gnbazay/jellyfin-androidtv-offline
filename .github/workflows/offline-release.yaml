name: Offline / Release

# Builds a signed release APK and publishes it as a GitHub release when a tag
# like v0.20.0-offline.1 is pushed. The APK is uploaded twice: with a versioned
# name and as "jellyfin-offline.apk" so the URL
# https://github.com/<owner>/<repo>/releases/latest/download/jellyfin-offline.apk
# always points to the newest build (used by Downloader and the in-app updater).

on:
  push:
    tags:
      - v*-offline.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.20.0-offline.1
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .tools-versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set JELLYFIN_VERSION
        run: echo "JELLYFIN_VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > keystore.jks

      - name: Assemble release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease versionTxt

      - name: Prepare release files
        run: |
          mkdir -p build/offline-publish
          apk=$(ls app/build/outputs/apk/release/jellyfin-offline-*-release.apk | head -n1)
          cp "$apk" build/offline-publish/
          cp "$apk" build/offline-publish/jellyfin-offline.apk
          cp app/build/version.txt build/offline-publish/
          ls -la build/offline-publish

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Section "## [<tag>] - <date>" until the next "## [" heading
          awk -v tag="$TAG" 'index($0, "## [" tag "]") == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            echo "::warning::No CHANGELOG.md entry for $TAG, using generated notes"
          fi
          cat build/release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s build/release-notes.md ]; then
            NOTES=(--notes-file build/release-notes.md)
          else
            NOTES=(--generate-notes)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/offline-publish/* --clobber
            if [ -s build/release-notes.md ]; then gh release edit "$TAG" --notes-file build/release-notes.md; fi
          else
            gh release create "$TAG" build/offline-publish/* --title "Jellyfin Offline $TAG" "${NOTES[@]}" --latest
          fi
